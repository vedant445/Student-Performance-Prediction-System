version: "3"

services:

  student-app:
    build: ..
    container_name: student-app

    ports:
      - "8501:8501"   # Streamlit
      - "8000:8000"   # Prometheus metrics

  prometheus:
    image: prom/prometheus
    container_name: prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      - student-app

  grafana:
    image: grafana/grafana
    container_name: grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus